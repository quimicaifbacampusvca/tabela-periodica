name: Verificar Tabela Mobile
on:
  pull_request:
    branches: [construção]
    paths:
      - 'index.html'
      - 'assets/cordel-collection.css'
      - 'sw.js'
      - 'tests/verify-periodic-mobile.cjs'
      - '.github/workflows/verify-periodic-mobile.yml'
jobs:
  test-mobile-periodic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar grade e conteúdo mobile
        run: node tests/verify-periodic-mobile.cjs
